name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and upload artifacts but never publish a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

env:
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"
  # FoundationDB client used to link the erlfdb NIF. 7.3.69 is on the same 7.3
  # line the rest of the org builds against, and is new enough to ship
  # artifacts for all four targets (7.3.32 has no linux aarch64 build).
  FDB_VERSION: "7.3.69"
  # Pin the FDB API version instead of letting erlfdb detect it by shelling out
  # to fdbcli. Artifacts then work against any client at or above this version.
  ERLFDB_COMPILE_API_VERSION: "730"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64
            fdb_arch: arm64
          - target: macos-x86_64
            os: macos-15-intel
            platform: macos
            arch: x86_64
            fdb_arch: x86_64
          # Built on 22.04 rather than latest: the release bundles ERTS, whose
          # binaries link the build machine's glibc/libssl, so building on the
          # oldest supported LTS keeps the artifacts usable on more distros.
          - target: linux-x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            fdb_arch: amd64
            deb_arch: amd64
          - target: linux-aarch64
            os: ubuntu-22.04-arm
            platform: linux
            arch: aarch64
            fdb_arch: aarch64
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          MIX_VERSION="$(sed -n 's/^ *version: "\([^"]*\)".*/\1/p' mix.exs | head -1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$MIX_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match mix.exs version $MIX_VERSION"
              exit 1
            fi
          else
            VERSION="$MIX_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install FoundationDB client (linux)
        if: matrix.platform == 'linux'
        run: |
          BASE="https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}"
          curl -fsSL -o fdb-clients.deb "$BASE/foundationdb-clients_${FDB_VERSION}-1_${{ matrix.fdb_arch }}.deb"
          sudo dpkg -i fdb-clients.deb
          # erlfdb links against this exact path; fail loudly if the layout moves.
          if [ ! -f /usr/lib/libfdb_c.so ]; then
            echo "::error::libfdb_c.so is not at /usr/lib, which is where erlfdb links it from"
            find / -name 'libfdb_c*' 2>/dev/null | head
            exit 1
          fi

      - name: Install FoundationDB client (macos)
        if: matrix.platform == 'macos'
        run: |
          BASE="https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}"
          # macOS has no client-only package; the combined pkg is the only option.
          curl -fsSL -o fdb.pkg "$BASE/FoundationDB-${FDB_VERSION}_${{ matrix.fdb_arch }}.pkg"
          sudo installer -pkg fdb.pkg -target /
          if [ ! -f /usr/local/lib/libfdb_c.dylib ]; then
            echo "::error::libfdb_c.dylib is not at /usr/local/lib, which is where erlfdb links it from"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ matrix.os }}-otp${{ env.OTP_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ matrix.os }}-otp${{ env.OTP_VERSION }}-mix-

      - name: Build release
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          # `mix release --overwrite` overwrites files but does not prune stale
          # application directories, which silently ships duplicate versions of
          # deps. Always build into a clean directory.
          rm -rf _build/prod/rel
          mix release --overwrite

      - name: Smoke test release
        run: |
          _build/prod/rel/efsql/bin/efsql --version
          # Loads the erlfdb NIF, which dlopens libfdb_c: catches broken linkage.
          _build/prod/rel/efsql/bin/efsql --check

      - name: Package tar.gz
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/efsql-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            -C _build/prod/rel efsql

      - name: Package deb
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          ROOT="debroot"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/lib/efsql" "$ROOT/usr/bin"
          cp -a _build/prod/rel/efsql/. "$ROOT/usr/lib/efsql/"
          # Relative symlink; bin/efsql resolves symlinks to find RELEASE_ROOT.
          ln -s ../lib/efsql/bin/efsql "$ROOT/usr/bin/efsql"
          {
            echo "Package: efsql"
            echo "Version: ${VERSION}"
            echo "Section: database"
            echo "Priority: optional"
            echo "Architecture: ${DEB_ARCH}"
            echo "Maintainer: FoundationDB BEAM <foundationdb-beam@users.noreply.github.com>"
            echo "Homepage: https://github.com/foundationdb-beam/efsql"
            # foundationdb-clients is not in the Debian archive (it ships from
            # apple/foundationdb releases), so this cannot be a hard Depends
            # without making the package uninstallable.
            echo "Recommends: foundationdb-clients"
            echo "Depends: libc6, libncursesw6, libssl3, zlib1g"
            echo "Description: SQL frontend and data explorer for FoundationDB"
            echo " efsql is a read-only SQL CLI and terminal UI for exploring"
            echo " FoundationDB databases managed with EctoFoundationDB. It"
            echo " bundles its own Erlang runtime."
            echo " ."
            echo " Requires the FoundationDB client library (libfdb_c) at"
            echo " /usr/lib/libfdb_c.so. Run 'efsql --check' to verify."
          } > "$ROOT/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$ROOT" "dist/efsql_${VERSION}_${DEB_ARCH}.deb"
          dpkg-deb --info "dist/efsql_${VERSION}_${DEB_ARCH}.deb"

      - name: Verify deb installs and runs
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          sudo dpkg -i "dist/efsql_${VERSION}_${DEB_ARCH}.deb"
          # Runs through /usr/bin/efsql, exercising the symlink resolution.
          efsql --version
          efsql --check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec mv {} dist/ \;
          cd dist
          # List extensions explicitly so the checksum file cannot include itself.
          sha256sum -- *.tar.gz *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo is required: this job only downloads artifacts, so there is
          # no checkout for gh to infer the repository from.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "efsql $GITHUB_REF_NAME" \
            --generate-notes

  homebrew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-22.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render formula
        run: |
          V="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "$(find artifacts -name "$1" | head -1)" | cut -d' ' -f1; }
          sed \
            -e "s|@VERSION@|${V}|g" \
            -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
            -e "s|@SHA_MACOS_ARM64@|$(sha "efsql-${V}-macos-arm64.tar.gz")|" \
            -e "s|@SHA_MACOS_X86_64@|$(sha "efsql-${V}-macos-x86_64.tar.gz")|" \
            -e "s|@SHA_LINUX_AARCH64@|$(sha "efsql-${V}-linux-aarch64.tar.gz")|" \
            -e "s|@SHA_LINUX_X86_64@|$(sha "efsql-${V}-linux-x86_64.tar.gz")|" \
            .github/homebrew/efsql.rb.tmpl > efsql.rb
          cat efsql.rb

      - name: Push to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'foundationdb-beam/homebrew-tap' }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping tap update."
            echo "Create the tap repo, add a PAT with contents:write as HOMEBREW_TAP_TOKEN, and re-run."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp efsql.rb tap/Formula/efsql.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/efsql.rb
          git diff --staged --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "efsql ${GITHUB_REF_NAME#v}"
          git push
